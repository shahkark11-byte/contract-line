<style>
@font-face{font-family:P;font-weight:400;font-display:swap;src:url(fonts/poppins-regular.woff2) format('woff2')}
@font-face{font-family:P;font-weight:600;font-display:swap;src:url(fonts/poppins-semibold.woff2) format('woff2')}
@font-face{font-family:P;font-weight:800;font-display:swap;src:url(fonts/poppins-extrabold.woff2) format('woff2')}
:root{--bg:#18181b;--bar:#1f1f23;--card:#26262b;--card2:#2f2f35;--ink:#f4f3ef;--muted:#b0afaa;--line:#3a3a41;
--lo1:#3fbf7f;--lo2:#f2a93b;--lo3:#ef5b5b;--r:16px;--nav:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 P,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lo2);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:rgba(24,24,27,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px}
.top svg.mk{width:30px;height:30px;flex:none}
.top .tt{font-weight:800;font-size:17px;letter-spacing:-.2px;line-height:1.1}
.top .tt small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.2px}
.top .dots{margin-left:auto;display:flex;gap:5px}
.top .dots i{width:9px;height:9px;border-radius:50%;display:block}
main{max-width:640px;margin:0 auto;padding:18px 16px 8px}
h1{font-weight:800;font-size:clamp(30px,8.6vw,44px);line-height:1.05;letter-spacing:-.8px}
h2{font-weight:800;font-size:24px;line-height:1.15;letter-spacing:-.3px;margin:28px 0 10px}
h3{font-weight:600;font-size:18px;line-height:1.3}
p{margin:8px 0}
.muted{color:var(--muted)}
.lead{font-size:18px;color:var(--muted);margin-top:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;padding:12px 18px;font-weight:600;font-size:17px;
  background:var(--ink);color:#18181b;text-decoration:none;width:100%}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn svg{width:20px;height:20px}
.tiles{display:grid;gap:10px;margin:14px 0}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;text-decoration:none;min-height:76px}
.tile .chip{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#18181b}
.tile .tx b{display:block;font-size:18px;font-weight:600;line-height:1.25}
.tile .tx span{font-size:14.5px;color:var(--muted);line-height:1.35;display:block}
.tile .go{margin-left:auto;color:var(--muted);flex:none}
.tile .go svg{width:22px;height:22px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:7px;color:#18181b;text-transform:uppercase}
.cite{font-size:14px;color:var(--muted);font-style:italic;margin-top:6px}
.map{width:100%;height:auto;display:block;margin:18px 0 4px}
.map text{font-family:P;font-weight:600}
.vcard{background:var(--card);border-radius:var(--r);padding:14px;margin:16px 0;scroll-margin-top:70px}
.vhead{display:flex;gap:12px;align-items:center}
.vhead .dot{width:14px;height:14px;border-radius:50%;flex:none}
.vhead b{display:block;font-weight:600;font-size:18px}
.vhead span{font-size:14.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.vchip{border:2px solid;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;text-decoration:none}
.vid{position:relative;border-radius:var(--r);overflow:hidden;background:#000;margin:8px auto 14px;aspect-ratio:9/16;height:min(64vh,620px);max-width:100%}
.vlabel{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--muted);margin-top:18px}
.vlabel svg{width:18px;height:18px;color:var(--lo1)}
.vid video{width:100%;height:100%;object-fit:contain;display:block}
/* line view */
.lhead{display:flex;align-items:center;gap:12px;margin-top:4px}
.lhead .chip{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#18181b;font-size:16px}
.lhead h1{font-size:34px}
.lhead p{margin:0;color:var(--muted)}
.metro{position:relative;margin:18px 0 8px;padding-left:34px}
.metro::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--c)}
.st{position:relative;margin:0 0 10px}
.st::before{content:"";position:absolute;left:-30px;top:17px;width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid var(--c);box-sizing:border-box}
.st.hub::before{width:24px;height:24px;left:-33px;top:15px;border-color:var(--bg);box-shadow:0 0 0 3px var(--c)}
details{background:var(--card);border-radius:14px}
summary{list-style:none;padding:13px 44px 13px 14px;position:relative;min-height:52px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:16px;top:22px;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(225deg);top:26px}
summary b{display:block;font-weight:600;font-size:18px;color:var(--c);line-height:1.3}
summary span{display:block;font-size:15px;color:var(--ink);line-height:1.4;margin-top:2px}
.body{padding:0 14px 14px;font-size:16px}
.body .ex{background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0}
.body .ex b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:block}
.case{border-left:3px solid var(--c);padding:2px 0 2px 10px;margin:10px 0}
.case b{display:block;font-weight:600;font-size:15px}
.case span{font-size:15px;color:var(--muted)}
.lawlink{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;margin:6px 6px 0 0;padding:7px 11px;border-radius:999px;background:var(--card2);text-decoration:none}
.lawlink svg{width:15px;height:15px}
.newbox{border:1.5px solid var(--lo1);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.hubcard{background:var(--card2);border-radius:14px;padding:14px}
.hubcard b{font-weight:800;font-size:19px;color:var(--c)}
.next{margin:22px 0 6px}
/* story */
.prog{display:flex;gap:4px;margin:6px 0 16px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.scard{background:var(--card);border-radius:20px;padding:20px 18px;min-height:52vh;display:flex;flex-direction:column;touch-action:pan-y}
.scard .step{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.scard h2{margin:8px 0 6px;font-size:28px}
.scard .scene{font-size:19px;line-height:1.5}
.scard .law{margin-top:auto;background:var(--card2);border-radius:14px;padding:14px;border-top:4px solid var(--c)}
.scard .law b{display:block;color:var(--c);font-weight:800;font-size:18px}
.navrow{display:flex;gap:10px;margin-top:14px}
.navrow .btn{flex:1}
.sam{width:84px;height:auto;display:block;margin:10px 0 2px}
/* quiz */
.qopts{display:grid;gap:10px;margin-top:16px}
.qopt{text-align:left;background:var(--card2);border-radius:14px;padding:15px 16px;min-height:56px;font-size:17px;font-weight:600;border:2px solid transparent;width:100%}
.qopt.right{border-color:var(--lo1);background:rgba(63,191,127,.14)}
.qopt.wrong{border-color:var(--lo3);background:rgba(239,91,91,.14)}
.fb{margin-top:14px;border-radius:14px;padding:14px;background:var(--card2)}
.fb b{font-size:18px}
.score{font-size:64px;font-weight:800;line-height:1}
/* lists */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;min-height:52px;margin:12px 0;position:sticky;top:64px;z-index:5}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:17px;outline:none;min-width:0;padding:12px 0}
.search svg{width:20px;height:20px;color:var(--muted)}
.gl{padding:12px 2px;border-bottom:1px solid var(--line)}
.gl b{font-weight:600;display:block}
.gl span{font-size:15.5px;color:var(--muted)}
.crow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.crow .ci{width:42px;height:42px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.crow b{font-weight:600;display:block;line-height:1.3}
.crow span{font-size:15px;color:var(--muted)}
.logo-lg{width:220px;max-width:70%;height:auto;display:block;margin:6px 0 10px}
.foot{font-size:13.5px;color:var(--muted);text-align:center;margin:28px 0 8px;line-height:1.5}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(31,31,35,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 0;border-radius:12px;min-height:52px;justify-content:center}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current=page]{color:var(--ink)}
nav.tabs a[aria-current=page] svg{color:var(--lo1)}
@media (prefers-reduced-motion:no-preference){body:not(.still) .fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (min-width:700px){body{font-size:18px}main{padding-top:28px}}
</style>

<script id="data" type="application/json">{"lines": [{"id": 1, "key": "lo1", "name": "Formation", "q": "Is it a contract?", "intro": "A contract is “an agreement which creates, or is intended to create, a legal obligation between the parties to it” (Enid Marshall). Most are not written down: buying a bus ticket or a newspaper is a contract too. Every one needs the same elements.", "stations": [{"name": "Invitation to Treat", "short": "Goods on a shelf aren't an offer. You make the offer at the till.", "more": "Price tags, shop displays and adverts only invite people to make offers. The shop can still say no.", "ex": "Adam, 16, takes a bottle of beer to the till. The assistant refuses to sell it. There's no contract: the shelf was only an invitation. John, 40, does the same and the sale goes through. That is offer and acceptance.", "cases": [["Pharmaceutical Society of GB v Boots (1953)", "Goods on self-service shelves are an invitation to treat. The customer makes the offer at the till."], ["Fisher v Bell (1961)", "A knife displayed in a shop window was not an offer for sale."]], "law": []}, {"name": "Offer", "short": "Precise and definite: “I'll sell you my laptop for £200.”", "more": "An offer shows you are willing to be legally bound on set terms. If it's vague, there can be no meeting of the minds, so it can't be accepted. Every contract needs at least two parties.", "ex": "“I'll sell you my laptop for £200” is an offer. “I might sell my laptop at some point” is not.", "cases": [["Carlill v Carbolic Smoke Ball Co (1893)", "An advert promising £100 to anyone who caught flu after using the smoke ball was a real offer, made to the whole world."]], "law": []}, {"name": "Acceptance", "short": "Unconditional. New terms = a counter-offer, which kills the original offer.", "more": "Acceptance must match the offer exactly and be communicated. Adding a new condition is a qualified acceptance: it is really a counter-offer, and the original offer is gone. If the offeror insists on a method of acceptance (“in writing”), only that method works.", "ex": "You offer your bike for £100. A friend says “yes, if you add the lock”. That's a counter-offer, and your £100 offer has ended.", "cases": [["Wolf & Wolf v Forfar Potato Co (1984)", "A Dutch buyer “accepted” an offer of potatoes but added new conditions, then tried to accept the original offer. Held: no contract. The first reply was a counter-offer that killed the original offer."], ["Holwell Securities v Hughes (1974)", "The offeror insisted on notice in writing, so no other method of acceptance counted."]], "law": ["CFR"], "new": "The Contract (Formation and Remedies) (Scotland) Act 2026 (Royal Assent 14 April 2026) abolishes the old postal rule, where a contract was made the moment the letter was posted (s14). Once its main sections are brought into force, an acceptance will only take effect when it reaches the other person (s13). Until then, the old rule still applies."}, {"name": "Consensus in Idem", "short": "A meeting of the minds on every material term.", "more": "Both parties must agree on the same thing. If they are talking about different things, no contract is formed at all.", "ex": "“We can supply equipment to remove the mould for £500” versus “I accept your offer to remove the mould for £500”. Equipment hire or a cleaning job? That's not the same deal.", "cases": [["Mathieson Gee (Ayrshire) Ltd v Quigley (1952)", "A plant hire firm offered equipment to clear a pond. The owner thought they would do the work. No consensus in idem, so no contract and no breach."]], "law": []}, {"name": "Intention", "short": "Coffee with a friend is an agreement, not a contract.", "more": "The parties must intend their agreement to be enforceable in law. Social arrangements usually lack this. Business deals have it.", "ex": "Your friend agrees to meet for coffee and doesn't turn up. There was offer, acceptance and agreement, but no intention to create legal relations, so a court won't get involved.", "cases": [], "law": []}, {"name": "Capacity", "short": "Under 16: everyday deals only. 16–17: a prejudicial deal can be undone until 21.", "more": "Under 16s have no capacity to contract (s1), except for transactions that are common for their age and on reasonable terms (s2). From 16 you have full capacity, but a prejudicial transaction made at 16 or 17 can be set aside by the court until you turn 21 (s3). Adults who cannot make, communicate, understand or remember decisions are protected by the Adults with Incapacity (Scotland) Act 2000. A contract made while very drunk is voidable, but you must act quickly.", "ex": "A 14-year-old buying sweets: valid. A 17-year-old signing a deal that a sensible adult never would: can be undone until 21.", "cases": [["Taylor v Provan (1864)", "Provan bought cattle while drunk. He wasn't drunk enough to not understand, so the contract was valid."], ["Pollock v Burns (1875)", "A man said he'd signed a bill while drunk, but waited six months to challenge it. Too late."]], "law": ["ALC", "AWI"]}], "hub": ["CONTRACT FORMED", "All the elements are present: a legally enforceable agreement."], "extra": ["Only in Scotland", "Scots law needs no “consideration”. A one-sided (gratuitous) promise can bind on its own: promise a £5 reward for your lost wallet and the finder can claim it. Gratuitous promises outside business need to be in writing.", "Morton's Trustees v Aged Christian Friend Society (1899)", ["ROW"]]}, {"id": 2, "key": "lo2", "name": "Validity", "q": "Does it hold?", "intro": "A contract can look complete and still have a defect. How serious the defect is decides what happens.", "hub": ["VOID or VOIDABLE?", "Void: it never existed (void ab initio). Nobody can enforce it, and a loss can only be claimed through unjustified enrichment. Voidable: valid until set aside. The parties can live with the defect or use it to end the contract, but only if restitutio in integrum (going back to the start) is possible.", [["O'Neill v Chief Constable of Strathclyde (1994)", "A car swap involved a stolen car, so the contract was void. A buyer further down the chain got no ownership."], ["Boyd & Forrest v Glasgow & South-Western Railway (1915)", "Contractors who built a railway couldn't undo the contract: you can't put the rock back. Restitutio was impossible."]]], "stations": [{"name": "Illegality", "short": "Illegal from the start = void. Performed illegally? The innocent side keeps remedies.", "more": "If a contract can't be performed without breaking the law, it is illegal at formation and void. A lawful contract carried out in an illegal way: the guilty party loses its rights, but an innocent party who didn't know keeps theirs.", "ex": "Hiring someone to commit a crime is void from the start. Nobody can sue on it.", "cases": [["David Taylor & Son v Barnett Trading Co (1953)", "A sale above the legal maximum price was illegal at formation, so no damages for non-delivery."], ["Anderson Ltd v Daniel (1924)", "Selling fertiliser without the invoice the statute required made the contract illegal and void."]], "law": []}, {"name": "Error", "short": "Both mistaken about the root = void. Your own mistake usually still binds you.", "more": "Bilateral error (both sides make the same mistake, or each a different one) about something fundamental makes the contract void. A unilateral error usually doesn't: you're expected to know what you're agreeing to. Exceptions are when the error was induced, is so fundamental there's no consensus, or the other side knowingly takes advantage of it.", "ex": "You misread the price on a contract you signed. That's your own unilateral error, and you're probably still bound.", "cases": [["McLaughlin v New Housing Association (2008)", "A bilateral error that went to the root of the contract made it void."], ["Spook Erection (Northern) Ltd v Kaye", "Sellers thought a lease ran 990 years. It was 99. Their own uninduced error: the contract stood."]], "law": []}, {"name": "Misrepresentation", "short": "A false statement that induces the deal: innocent, negligent or fraudulent.", "more": "Innocent: an honest belief. The contract is voidable but there are no damages. Fraudulent: you knew it was false, didn't believe it, or didn't care (Derry v Peek); damages available. Negligent: a special professional relationship and a duty of care; damages available. Setting the contract aside needs restitutio in integrum. If that's impossible, the contract stands, though damages may be possible.", "ex": "A seller genuinely believes a fake dress is vintage designer: innocent misrepresentation.", "cases": [["Derry v Peek (1889)", "Set the test for fraud: knowing it's false, not believing it, or reckless as to whether it's true."], ["Morrisson v Robertson (1908)", "A buyer pretended to be someone else to get two cows: fraud."], ["Hedley Byrne v Heller & Partners (1963)", "A bank gave a careless reference: the first negligent misrepresentation case."], ["Wilson v Marquis of Breadalbane (1859)", "The cattle had been eaten, so restitution was impossible. The buyer paid market price instead."]], "law": []}, {"name": "Capacity Defects", "short": "Under 16, an incapax adult, or very drunk: void or voidable.", "more": "Capacity also affects validity: an under-16's unusual or unreasonable deal is void, a prejudicial deal at 16–17 is voidable until 21, and a very drunk party's contract is voidable if they act quickly.", "ex": "See the Capacity station on the Formation line.", "cases": [["Taylor v Provan (1864)", "Drunk, but not drunk enough: the contract was valid."]], "law": ["ALC", "AWI"]}, {"name": "Unfair Terms", "short": "Not binding on a consumer. No excluding death or injury caused by negligence.", "more": "Under the Consumer Rights Act 2015 an unfair term or notice is not binding on a consumer (s62), and the rest of the contract carries on. A trader can't exclude liability for death or personal injury caused by negligence (s65), or your statutory rights over faulty goods. An exclusion clause must be part of the contract, and reasonable notice of it must be given.", "ex": "A caterer's contract says “no responsibility for death by food poisoning”. That term does not bind the customer.", "cases": [["Thornton v Shoe Lane Parking (1971)", "Terms printed on a car park ticket came too late: the contract was already made at the machine."], ["Olley v Marlborough Court Hotel (1949)", "A notice in the hotel bedroom came after the contract was made at reception, so it didn't count."], ["Taylor v Glasgow Corporation (1952)", "A Scottish exclusion clause case from the course booklet."]], "law": ["CRA", "UCTA"]}, {"name": "Restrictive Covenants", "short": "Must be reasonable to both sides and to the public, or void.", "more": "Three types: employer and employee, the seller and buyer of a business, and solus agreements (a retailer tied to one supplier). Courts look at the area, the length of time, how common the business is and the job. A covenant protecting a business buyer's goodwill is more likely to stand.", "ex": "Your part-time job says you can never work for any rival, anywhere, ever. That's almost certainly unreasonable.", "cases": [["Esso Petroleum v Harper's Garage (1968)", "A 5-year petrol tie was reasonable and enforced. A 21-year tie was unreasonable and void."], ["Bluebell Apparel v Dickinson (1980)", "Employer and employee covenant."], ["Dumbarton Steamboat Co v MacFarlane (1899)", "Seller of a business covenant."]], "law": []}]}, {"id": 3, "key": "lo3", "name": "Termination", "q": "How does it end?", "intro": "Contracts don't last forever. Rights and obligations exist until the contract is terminated, and there are eight ways that can happen, plus breach.", "stations": [{"name": "Performance", "short": "Both sides do what they promised.", "more": "The most common ending: A pays the money, B hands over the goods. Done.", "ex": "You pay for a meal deal and walk out with it.", "cases": [], "law": []}, {"name": "Acceptilation", "short": "One side lets the other off.", "more": "One party waives full performance and the other is discharged. Agreeing a discount is a common form.", "ex": "“Keep it. This one's on me.”", "cases": [], "law": []}, {"name": "Delegation", "short": "A third party takes over, e.g. a parent pays the rent.", "more": "A new party takes on the obligations and performs them. The other contracting party must agree.", "ex": "A parent takes over paying a student's rent.", "cases": [], "law": []}, {"name": "Novation", "short": "A new contract replaces the old: a phone upgrade.", "more": "A new contract with new terms overrides the first one, releasing both sides from the original obligations.", "ex": "Upgrading your phone contract.", "cases": [], "law": []}, {"name": "Compensation", "short": "Two equal debts cancel out (set-off).", "more": "When two parties owe each other money, the debts are set off instead of making two payments.", "ex": "Anne owes Ben £5,000 for decorating. Ben agrees to buy Anne's car for £5,000. The debts cancel out.", "cases": [], "law": []}, {"name": "Confusion", "short": "Debtor and creditor become the same person.", "more": "When the same person ends up owing a debt to themselves, the debt disappears.", "ex": "A man borrows £1,000 from his father, then inherits his father's estate, including the debt. It's cleared.", "cases": [], "law": []}, {"name": "Prescription", "short": "Five years without a claim and it's gone.", "more": "Rights under a contract don't last forever. A contractual debt or obligation is extinguished if no claim is made within five years.", "ex": "A owes B £700 for a PC. Five years pass with no claim from B: the debt is extinguished.", "cases": [], "law": ["PLSA"]}, {"name": "Frustration", "short": "Nobody's fault and now impossible or illegal. Harder or dearer isn't enough.", "more": "When, through no one's fault, performance becomes impossible (rei interitus: the subject matter is destroyed) or illegal, the contract is frustrated. There are no damages. A contract is NOT frustrated just because it became harder or more expensive.", "ex": "The venue you booked burns down before the event.", "cases": [["Taylor v Caldwell (1863)", "A music hall burned down before the concerts. Frustrated, so no damages."], ["Fraser v Denny Mott & Dickson (1944)", "A wartime order made the timber trade illegal: frustrated."], ["Davis Contractors v Fareham UDC (1956)", "Bad weather and labour shortages turned 8 months into 22. Harder and dearer, but not frustrated."]], "law": []}], "hub": ["CONTRACT ENDS", ""], "breach": {"intro": "A breach is when a party fails to carry out an obligation, or does it late or badly. The innocent (aggrieved) party can look for a remedy.", "types": [["Anticipatory", "They say before the due date that they won't perform."], ["Repudiatory", "They refuse on or after the due date."], ["Late performance", "The caterer booked for 5–7pm turns up at 8."], ["Defective performance", "The extension is finished on time, but it leaks."]], "remedies": [["Damages", "Puts you where you'd be if the contract had been performed. Scots law repairs the loss, it doesn't punish. Four tests: a breach; it caused the loss, and the loss isn't too remote; the loss can be calculated; and you mitigated it. General damages cover losses you can't easily price, special damages cover losses you can (like lost profit), and liquidated damages are agreed in the contract.", [["Hadley v Baxendale (1854)", "A crankshaft came back 7 days late and the mill lost profit. Damages cover losses arising naturally, or ones both sides had in mind when contracting."]]], ["Specific Implement", "The court orders the party to do what they promised. Not for paying money, goods easily bought elsewhere, personal relationships, or anything impossible or unfair.", []], ["Interdict", "The court orders the party to stop doing something.", []], ["Rescission", "If the breach is material, you can cancel the contract and claim damages.", []], ["Retention & Lien", "Self-help: hold back payment that's due (retention), or keep their goods until they pay (lien), like a garage keeping your car until the bill is paid.", []]]}}], "story": [["lo1", "The advert", "Sam, 17, finds a car on a dealer's website for £2,000.", "Invitation to Treat", "The advert isn't an offer. It invites Sam to make one."], ["lo1", "The offer", "Sam emails: “I'll pay £1,800 for the blue Fiesta, reg SK19 ABC.”", "Offer", "Precise and definite: price, car and parties are all clear."], ["lo1", "The counter-offer", "The dealer replies: “Can't do £1,800. £1,900 and it's yours.”", "Counter-offer", "New terms. Sam's £1,800 offer is dead (Wolf & Wolf v Forfar Potato Co)."], ["lo1", "Deal!", "Sam emails back “Deal at £1,900”. The dealer opens it ten minutes later.", "Acceptance", "Once the 2026 Act is in force, it counts when it reaches the dealer, not when Sam presses send."], ["lo1", "Same car, same price, serious", "Both mean the same car at the same price, and it's a business deal, not a favour.", "Consensus + Intention", "A meeting of the minds, and an intention to be legally bound."], ["lo1", "Is Sam old enough?", "Sam is 17, so Sam has full capacity.", "Capacity", "But if the deal turns out to be prejudicial, a court can set it aside until Sam is 21. ✔ Contract formed."], ["lo2", "The lie", "The dealer said “one owner, never crashed”. A mechanic finds it was badly crashed, and the dealer knew.", "Fraudulent misrepresentation", "The contract is voidable. Sam can rescind if the car can be handed back (restitutio in integrum), and claim damages."], ["lo2", "The small print", "The paperwork says “Sold as seen. No refunds.”", "Unfair terms", "The dealer is a trader and Sam is a consumer. Under the Consumer Rights Act 2015, Sam's statutory rights can't be signed away."], ["lo3", "Ending A", "Sam pays, the dealer hands over the keys, and everyone's happy.", "Performance", "Both sides did what they promised. The contract ends."], ["lo3", "Ending B", "The gearbox fails in week one.", "Breach: defective performance", "Sam can claim damages, or rescind if the breach is material."], ["lo3", "Ending C", "Before handover, a flood destroys the car. Nobody's fault.", "Frustration", "Performance is impossible (Taylor v Caldwell). The contract is frustrated, so no damages."]], "quiz": [["A price tag on a phone case in a shop window says £5. Is that an offer?", ["Yes, the shop must sell it at £5", "No, it's an invitation to treat"], 1, "Displays are invitations to treat. You make the offer at the till, and the shop can accept or refuse.", "Pharmaceutical Society v Boots (1953)"], ["A seller offers a bike for £100. You reply “£90?”. They say no, so you say “fine, £100”. Is there a contract?", ["Yes, you accepted £100", "No, your counter-offer killed the £100 offer"], 1, "A counter-offer rejects the original offer. Your later “£100” is a new offer that they're free to accept or refuse.", "Wolf & Wolf v Forfar Potato Co (1984)"], ["Your friend agrees to meet you for coffee and doesn't show. Can you sue?", ["Yes, there was offer and acceptance", "No, there was no intention to create legal relations"], 1, "Social arrangements are agreements, not contracts.", "Intention to create legal relations"], ["A 14-year-old buys a bag of sweets. Is the contract valid?", ["Yes, it's a reasonable everyday transaction", "No, under 16s can never contract"], 0, "Under 16s can make transactions common for their age on reasonable terms.", "Age of Legal Capacity (Scotland) Act 1991, s2"], ["Sam, 17, signs a deal that any sensible adult would avoid. What can Sam do?", ["Nothing, 16 is full capacity", "Ask the court to set it aside before turning 21"], 1, "16 and 17 year olds have full capacity, but a prejudicial transaction can be set aside until age 21.", "Age of Legal Capacity (Scotland) Act 1991, s3"], ["Under the new 2026 Act, when will an acceptance take effect?", ["When it is sent or posted", "When it reaches the other person"], 1, "The Act abolishes the postal rule. Once its main sections come into force, an acceptance must reach the other person.", "Contract (Formation and Remedies) (Scotland) Act 2026, ss13–14"], ["A seller honestly but wrongly says a dress is vintage designer. Can the buyer get damages?", ["Yes, always", "No, innocent misrepresentation means no damages"], 1, "Innocent misrepresentation can make the contract voidable, but there are no damages. Damages are only for fraudulent or negligent misrepresentation.", "Ritchie v Glass (1936)"], ["A gym sign says “No liability for injury, however caused”. Staff negligence injures you. Does the sign protect the gym?", ["Yes, you saw the sign", "No, a trader can't exclude that"], 1, "A trader can't exclude liability for death or personal injury caused by negligence.", "Consumer Rights Act 2015, s65"], ["The concert hall you hired burns down before your event. Is that a breach?", ["Yes, they must pay damages", "No, the contract is frustrated"], 1, "The subject matter was destroyed through nobody's fault, so the contract is frustrated and there are no damages.", "Taylor v Caldwell (1863)"], ["Bad weather makes a building job take 22 months instead of 8, and cost much more. Is it frustrated?", ["Yes, it's radically different", "No, harder or dearer isn't frustration"], 1, "Unforeseen difficulty or expense doesn't frustrate a contract.", "Davis Contractors v Fareham UDC (1956)"]], "law": {"ALC": ["Age of Legal Capacity (Scotland) Act 1991", "https://www.legislation.gov.uk/ukpga/1991/50/contents"], "AWI": ["Adults with Incapacity (Scotland) Act 2000", "https://www.legislation.gov.uk/asp/2000/4/contents"], "ROW": ["Requirements of Writing (Scotland) Act 1995", "https://www.legislation.gov.uk/ukpga/1995/7/contents"], "CRA": ["Consumer Rights Act 2015", "https://www.legislation.gov.uk/ukpga/2015/15/contents"], "UCTA": ["Unfair Contract Terms Act 1977", "https://www.legislation.gov.uk/ukpga/1977/50/contents"], "PLSA": ["Prescription and Limitation (Scotland) Act 1973", "https://www.legislation.gov.uk/ukpga/1973/52/contents"], "CFR": ["Contract (Formation and Remedies) (Scotland) Act 2026", "https://www.legislation.gov.uk/asp/2026/10/contents"]}, "glossary": [["Void ab initio", "Void from the beginning: the contract never existed."], ["Restitutio in integrum", "Putting both parties back where they started. Needed before a voidable contract can be set aside."], ["Rei interitus", "Destruction of the subject matter. A cause of frustration."], ["Unjustified enrichment", "How you recover a loss when a contract turns out to be void."], ["Gratuitous promise", "A one-sided promise. Binding in Scotland without anything in return."], ["Prejudicial transaction", "A deal a prudent adult wouldn't make, which causes or is likely to cause substantial prejudice to a 16–17 year old."], ["Incapax", "An adult who can't make, communicate, understand or remember decisions."], ["Mitigation", "Taking reasonable steps to keep your loss down after a breach."], ["Remoteness", "A loss too far removed from the breach to be claimed (Hadley v Baxendale)."], ["Liquidated damages", "Damages agreed in the contract itself in advance."], ["Solus agreement", "A retailer agreeing to buy from only one supplier."], ["Aggrieved party", "The innocent party who suffers from a breach."]], "campus": [["sandwich", "Meal deal on the canteen shelf", "Invitation to treat: you offer at the till"], ["clipboard-pen", "Your enrolment form", "A written contract, and you have capacity at 16"], ["lock", "Locker sign: “no liability for loss”", "An exclusion notice may not protect them"], ["coffee", "“Coffee after class?”", "Agreement, but no intention: not a contract"], ["smartphone", "Upgrading your phone", "Novation: the new contract replaces the old"], ["briefcase", "Part-time job: “never work for a rival”", "Restrictive covenant: must be reasonable"], ["pizza", "“I got the pizza, you got the taxi”", "Compensation: the debts cancel out"]], "postal": {"tag": "NEW FOR 2026", "title": "The postal rule is on its way out", "body": "For almost two centuries, a posted acceptance made a contract the moment it hit the postbox. Once the new Act is in force, it will only count when it <b>reaches<\/b> the other person.", "cite": "Contract (Formation and Remedies) (Scotland) Act 2026, ss13–14 · old law: Thomson v James (1855)"}, "scotland": {"tag": "ONLY IN SCOTLAND", "title": "A promise can bind on its own", "body": "No “consideration” needed: nothing has to come back in return. Promise a £5 reward for your lost wallet and the finder can claim it.", "cite": "Morton's Trustees (1899) · must be in writing: Requirements of Writing (Scotland) Act 1995"}, "videos": {"trailer": "videos/trailer.mp4?v=3246169", "lo1": "videos/lo1.mp4?v=4769432", "lo2": "videos/lo2.mp4?v=4426146", "lo3": "videos/lo3.mp4?v=4819052", "life": "videos/life.mp4?v=6025979", "blueprint": "videos/blueprint.mp4?v=7711270"}, "captions": {"trailer": "videos/trailer.vtt", "lo1": "videos/lo1.vtt", "lo2": "videos/lo2.vtt", "lo3": "videos/lo3.vtt", "life": "videos/life.vtt", "blueprint": "videos/blueprint.vtt"}, "posters": {"trailer": "videos/trailer.jpg?v=23680", "lo1": "videos/lo1.jpg?v=29232", "lo2": "videos/lo2.jpg?v=25707", "lo3": "videos/lo3.jpg?v=18943", "life": "videos/life.jpg?v=42921", "blueprint": "videos/blueprint.jpg?v=50095"}, "catalogue": [["trailer", "Sam's first car", "The 30-second trailer: one deal along all three lines", "lo1"], ["lo1", "LO1 · Formation", "Six things that make a contract", "lo1"], ["lo2", "LO2 · Validity", "Void, voidable, and what breaks a deal", "lo2"], ["lo3", "LO3 · Termination", "Eight ways it ends, plus breach", "lo3"], ["life", "The Life of a Contract", "Born, tested, ended: a contract from cradle to coffin", "lo3"], ["blueprint", "Built to Last?", "Build it, inspect it, take it down", "lo2"]], "linkedin": "https://www.linkedin.com/in/shahkar-khan-331302199/", "icons": {"linkedin": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width= 0 1-2 2h-5.5\" />  <path d=\"M4 13.5V6a2 2 0 0 1 2-2h2\" />  <path d=\"M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z\" /><\/svg>", "lock": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width=\"22\"  height=\"22\"  viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\" />  <path d=\"M7 11V7a5 5 0 0 1 10 0v4\" /><\/svg>", "coffee": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width=\"22\"  height=\"22\"  viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <path d=\"M10 2v2\" />  <path d=\"M14 2v2\" />  <path d=\"M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1\" />  <path d=\"M6 2v2\" /><\/svg>", "smartphone": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width=\"22\"  height=\"22\"  viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <rect width=\"14\" height=\"20\" x=\"5\" y=\"2\" rx=\"2\" ry=\"2\" />  <path d=\"M12 18h.01\" /><\/svg>", "briefcase": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width=\"22\"  height=\"22\"  viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\" />  <rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\" /><\/svg>", "pizza": "<svg    xmlns=\"http://www.w3.org/2000/svg\"  width=\"22\"  height=\"22\"  viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <path d=\"m12 14-1 1\" />  <path d=\"m13.75 18.25-1.25 1.42\" />  <path d=\"M17.775 5.654a15.68 15.68 0 0 0-12.121 12.12\" />  <path d=\"M18.8 9.3a1 1 0 0 0 2.1 7.7\" />  <path d=\"M21.964 20.732a1 1 0 0 1-1.232 1.232l-18-5a1 1 0 0 1-.695-1.232A19.68 19.68 0 0 1 15.732 2.037a1 1 0 0 1 1.232.695z\" /><\/svg>"}, "col": {"lo1": "#3fbf7f", "lo2": "#f2a93b", "lo3": "#ef5b5b"}, "name": "Shahkar Khan"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I = n => D.icons[n] || '';
const store = {get(k, d){try{const v = localStorage.getItem('cl_' + k); return v === null ? d : JSON.parse(v)}catch(e){return d}},
               set(k, v){try{localStorage.setItem('cl_' + k, JSON.stringify(v))}catch(e){}}};
const lawLinks = keys => (keys || []).map(k => `<a class="lawlink" href="${D.law[k][1]}" target="_blank" rel="noopener">${esc(D.law[k][0])} ${I('external-link')}</a>`).join('');
const cases = cs => (cs || []).map(([n, f]) => `<div class="case"><b>${esc(n)}</b><span>${esc(f)}</span></div>`).join('');
const video = (k, label) => D.videos[k] ? `${label ? `<div class="vlabel">${I('play')} ${label}</div>` : ''}<div class="vid"><video controls playsinline preload="none" ${D.posters[k] ? `poster="${D.posters[k]}"` : ''} src="${D.videos[k]}">${D.captions[k] ? `<track kind="captions" srclang="en" label="English" src="${D.captions[k]}">` : ''}</video></div>` : '';
const LINE = id => D.lines[id - 1];

function miniMap(){
  // the poster's snake: green row, amber row, red row
  const c = D.col, rows = [[c.lo1, 'LO1 Formation', 1, 34], [c.lo2, 'LO2 Validity', 2, 94], [c.lo3, 'LO3 Termination', 3, 154]];
  let s = `<svg class="map" viewBox="0 0 340 188" role="img" aria-label="Map of the three lines">`;
  s += `<path d="M24 34H300a20 20 0 0 1 20 20v20a20 20 0 0 1-20 20H40a20 20 0 0 0-20 20v20a20 20 0 0 0 20 20H316" fill="none" stroke="${c.lo2}" stroke-width="9" stroke-linecap="round"/>`;
  s += `<path d="M24 34H300" stroke="${c.lo1}" stroke-width="9" stroke-linecap="round"/><path d="M40 154H316" stroke="${c.lo3}" stroke-width="9" stroke-linecap="round"/>`;
  rows.forEach(([col, label, id, y]) => {
    for (let i = 0; i < 6; i++) s += `<circle cx="${52 + i * 46}" cy="${y}" r="6" fill="#f4f3ef" stroke="${col}" stroke-width="3"/>`;
    s += `<a href="#/line/${id}"><rect x="0" y="${y - 30}" width="340" height="56" fill="transparent"/><text x="${id === 2 ? 316 : id === 3 ? 48 : 24}" y="${y - 14}" text-anchor="${id === 2 ? 'end' : 'start'}" fill="${col}" font-size="15">${label} ›</text></a>`;
  });
  return s + `</svg>`;
}

const views = {
  home(){
    const done = store.get('quizBest', null);
    return `<div class="fade">
      <span class="tag" style="background:var(--lo1)">Scots law</span>
      <h1 style="margin-top:10px">You've boarded The Contract Line</h1>
      <p class="lead">How a contract is born, tested and ended, in three lines. Tap any line to ride it.</p>
      ${miniMap()}
      <a class="btn" href="#/story">${I('car')} Follow Sam's first car deal</a>
      <div class="tiles">
        ${D.lines.map(l => `<a class="tile" href="#/line/${l.id}"><span class="chip" style="background:${D.col[l.key]}">LO${l.id}</span><span class="tx"><b>${l.name}</b><span>${l.q} · ${l.stations.length} stops</span></span><span class="go">${I('chevron-right')}</span></a>`).join('')}
        ${D.catalogue.length ? `<a class="tile" href="#/videos"><span class="chip" style="background:var(--lo2)">${I('clapperboard')}</span><span class="tx"><b>Watch the videos</b><span>${D.catalogue.length} short films, about a minute each</span></span><span class="go">${I('chevron-right')}</span></a>` : ''}
        <a class="tile" href="#/quiz"><span class="chip" style="background:var(--ink)">${I('circle-help')}</span><span class="tx"><b>Is it a contract?</b><span>10 quick questions${done !== null ? ` · your best: ${done}/10` : ''}</span></span><span class="go">${I('chevron-right')}</span></a>
      </div>
      <div class="card"><span class="tag" style="background:var(--lo1)">${esc(D.postal.tag)}</span><h3 style="margin-top:8px">${esc(D.postal.title)}</h3><p>${D.postal.body}</p><div class="cite">${esc(D.postal.cite)}</div></div>
      <div class="card"><span class="tag" style="background:var(--lo2)">${esc(D.scotland.tag)}</span><h3 style="margin-top:8px">${esc(D.scotland.title)}</h3><p>${esc(D.scotland.body)}</p><div class="cite">${esc(D.scotland.cite)}</div></div>
      <p class="foot">Made by <a href="${D.linkedin}" target="_blank" rel="noopener" style="font-weight:600">${esc(D.name)}</a> · Commercial Law · New College Lanarkshire<br>A student project, not legal advice.</p></div>`;
  },
  lines(){
    return `<div class="fade"><h1>The lines</h1><p class="lead">Three learning outcomes, one journey.</p><div class="tiles">
      ${D.lines.map(l => `<a class="tile" href="#/line/${l.id}"><span class="chip" style="background:${D.col[l.key]}">LO${l.id}</span><span class="tx"><b>${l.name}</b><span>${l.q}</span></span><span class="go">${I('chevron-right')}</span></a>`).join('')}
      </div>${miniMap()}</div>`;
  },
  line(id){
    const l = LINE(+id); if (!l) return views.home();
    const c = D.col[l.key];
    let st = l.stations.map((s, i) => `<div class="st"><details${i === 0 ? ' open' : ''}><summary><b>${esc(s.name)}</b><span>${esc(s.short)}</span></summary><div class="body">
        <p>${esc(s.more)}</p>${s.ex ? `<div class="ex"><b>Example</b>${esc(s.ex)}</div>` : ''}
        ${s.new ? `<div class="newbox"><span class="tag" style="background:var(--lo1)">New for 2026</span><p style="margin:6px 0 0">${esc(s.new)}</p></div>` : ''}
        ${cases(s.cases)}${lawLinks(s.law)}</div></details></div>`).join('');
    if (l.id === 2) st = `<div class="st hub"><div class="hubcard"><b>${esc(l.hub[0])}</b><p>${esc(l.hub[1])}</p>${cases(l.hub[2])}</div></div>` + st;
    else if (l.hub && l.hub[1]) st += `<div class="st hub"><div class="hubcard"><b>${esc(l.hub[0])}</b><p style="margin-bottom:0">${esc(l.hub[1])}</p></div></div>`;
    else st += `<div class="st hub"><div class="hubcard"><b>${esc(l.hub[0])}</b></div></div>`;
    let extra = '';
    if (l.extra) extra = `<div class="card"><span class="tag" style="background:var(--lo2)">${esc(l.extra[0])}</span><p>${esc(l.extra[1])}</p><div class="cite">${esc(l.extra[2])}</div>${lawLinks(l.extra[3])}</div>`;
    if (l.breach) {
      const b = l.breach;
      extra = `<h2 style="color:var(--lo3)">Breach: when someone breaks it</h2><p>${esc(b.intro)}</p>
        <div class="card">${b.types.map(([n, d]) => `<p><b>${esc(n)}:</b> <span class="muted">${esc(d)}</span></p>`).join('')}</div>
        <h3 style="margin:16px 0 4px">Remedies</h3><div class="metro" style="--c:var(--lo3)">${b.remedies.map(([n, d, cs]) => `<div class="st"><details><summary><b>${esc(n)}</b><span>${esc(d.split('. ')[0])}.</span></summary><div class="body"><p>${esc(d)}</p>${cases(cs)}</div></details></div>`).join('')}</div>`;
    }
    const nxt = l.id < 3 ? `<a class="btn next" href="#/line/${l.id + 1}" style="background:${D.col[LINE(l.id + 1).key]}">Change here for LO${l.id + 1} ${LINE(l.id + 1).name} ${I('chevron-right')}</a>`
                         : `<a class="btn next" href="#/quiz">Test yourself: the quiz ${I('chevron-right')}</a>`;
    return `<div class="fade" style="--c:${c}">
      <div class="lhead"><span class="chip" style="background:${c}">LO${l.id}</span><div><h1>${l.name}</h1><p>${l.q}</p></div></div>
      <p class="lead">${esc(l.intro)}</p>${D.videos[l.key] ? `<a class="btn ghost" href="#/videos/${l.key}" style="margin-top:12px">${I('play')} Watch the LO${l.id} video</a>` : ''}
      <div class="metro">${st}</div>${extra}${nxt}</div>`;
  },
  story(n){
    const i = Math.max(0, Math.min(D.story.length - 1, (+n || 1) - 1));
    const [key, title, scene, term, law] = D.story[i];
    const c = D.col[key], line = D.lines.find(l => l.key === key);
    store.set('storyAt', i + 1);
    const prog = D.story.map((s, k) => `<i style="background:${k <= i ? D.col[s[0]] : 'var(--line)'}"></i>`).join('');
    const last = i === D.story.length - 1;
    return `<div class="fade" style="--c:${c}">
      <h1 style="font-size:30px">Sam's first car</h1><p class="muted" style="margin:2px 0 0">Sam is 17. Follow one deal along all three lines.</p>
      <div class="prog" aria-label="Step ${i + 1} of ${D.story.length}">${prog}</div>
      <div class="scard" id="swipe">
        <div class="step" style="color:${c}">LO${line.id} ${line.name} · ${i + 1} of ${D.story.length}</div>
        <h2>${esc(title)}</h2><p class="scene">${esc(scene)}</p>
        <div class="law"><b>${esc(term)}</b>${esc(law)}</div>
      </div>
      <div class="navrow">
        <a class="btn ghost" href="#/story/${i}" ${i === 0 ? 'style="visibility:hidden"' : ''}>${I('chevron-left')} Back</a>
        ${last ? `<a class="btn" href="#/quiz">Take the quiz ${I('chevron-right')}</a>` : `<a class="btn" href="#/story/${i + 2}">Next ${I('chevron-right')}</a>`}
      </div>
      <p class="foot">Swipe the card left or right</p></div>`;
  },
  quiz(n){
    const st = store.get('quiz', {i: 0, score: 0, answered: null});
    if (n === 'reset') { store.set('quiz', {i: 0, score: 0, answered: null}); location.replace('#/quiz'); return ''; }
    if (st.i >= D.quiz.length) {
      const best = Math.max(store.get('quizBest', 0), st.score); store.set('quizBest', best);
      const msg = st.score >= 9 ? 'Top of the class.' : st.score >= 7 ? 'Strong. Check the ones you missed on the lines.' : 'Worth another ride along the lines.';
      return `<div class="fade" style="text-align:center;padding-top:20px"><p class="muted">Your score</p><div class="score">${st.score}/10</div><p class="lead">${msg}</p>
        <div class="navrow"><a class="btn ghost" href="#/quiz/reset">${I('rotate-ccw')} Try again</a><a class="btn" href="#/lines">Ride the lines</a></div></div>`;
    }
    const [q, opts, ans, why, src] = D.quiz[st.i];
    const a = st.answered;
    return `<div class="fade"><h1 style="font-size:30px">Is it a contract?</h1>
      <div class="prog">${D.quiz.map((_, k) => `<i style="background:${k < st.i ? 'var(--lo1)' : k === st.i ? 'var(--ink)' : 'var(--line)'}"></i>`).join('')}</div>
      <p class="muted" style="font-size:14px;font-weight:600">QUESTION ${st.i + 1} OF ${D.quiz.length}</p>
      <h2 style="margin-top:4px">${esc(q)}</h2>
      <div class="qopts">${opts.map((o, k) => `<button class="qopt ${a === null ? '' : k === ans ? 'right' : k === a ? 'wrong' : ''}" data-k="${k}" ${a !== null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>
      ${a !== null ? `<div class="fb fade"><b style="color:${a === ans ? 'var(--lo1)' : 'var(--lo3)'}">${a === ans ? 'Correct' : 'Not quite'}</b><p>${esc(why)}</p><div class="cite">${esc(src)}</div></div>
        <a class="btn next" href="#/quiz/next">${st.i === D.quiz.length - 1 ? 'See your score' : 'Next question'} ${I('chevron-right')}</a>` : ''}</div>`;
  },

      <p class="lead">You make contracts every day at college, usually without noticing.</p>
      <div style="margin-top:8px">${D.campus.map(([ic, t, d]) => `<div class="crow"><span class="ci">${D.campusIcons[ic]}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div>
      <p class="foot">Made for the New College Lanarkshire Commercial Law poster challenge 2026.</p></div>`;
  },
  sources(){
    const all = [];
    D.lines.forEach(l => { l.stations.forEach(s => (s.cases || []).forEach(c => all.push([l.key, c[0]]))); if (l.hub && l.hub[2]) l.hub[2].forEach(c => all.push([l.key, c[0]])); });
    D.lines[2].breach.remedies.forEach(r => r[2].forEach(c => all.push(['lo3', c[0]])));
    const seen = new Set(), uniq = all.filter(([k, n]) => !seen.has(n) && seen.add(n));
    return `<div class="fade"><h1>Sources</h1><p class="lead">Built from the New College Lanarkshire Commercial Law LO1–LO3 lecture slides and handouts. The links go to the official text of each Act.</p>
      <h2>Acts</h2>${Object.keys(D.law).map(k => `<a class="tile" href="${D.law[k][1]}" target="_blank" rel="noopener" style="min-height:60px"><span class="tx"><b style="font-size:16.5px">${esc(D.law[k][0])}</b><span>legislation.gov.uk</span></span><span class="go">${I('external-link')}</span></a>`).join('')}
      <h2>Cases</h2>${['lo1', 'lo2', 'lo3'].map(k => uniq.filter(c => c[0] === k).map(c => `<div class="gl"><b style="color:${D.col[k]}">${esc(c[1])}</b></div>`).join('')).join('')}
      <p class="foot">A student project, not legal advice. The Contract (Formation and Remedies) (Scotland) Act 2026 received Royal Assent on 14 April 2026; check legislation.gov.uk for which sections are in force.</p></div>`;
  },
  about(){

const TABS = [['#/', 'house', 'Home', ['', 'home']], ['#/story', 'car', 'Sam', ['story']], ['#/lines', 'route', 'Lines', ['lines', 'line']], ['#/videos', 'clapperboard', 'Videos', ['videos']],
              ['#/quiz', 'circle-help', 'Quiz', ['quiz']], ['#/more', 'book-open', 'More', ['more', 'poster', 'glossary', 'college', 'sources', 'about']]];
document.getElementById('tabs').innerHTML = TABS.map(([h, ic, l]) => `<a href="${h}">${I(ic)}<span>${l}</span></a>`).join('');

function route(keepScroll){
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  let [v, arg] = parts;
  if (v === 'quiz' && arg === 'next') { const s = store.get('quiz', {i: 0, score: 0, answered: null}); store.set('quiz', {i: s.i + 1, score: s.score, answered: null}); location.replace('#/quiz'); return; }
  if (v === 'story' && !arg) arg = store.get('storyAt', 1);
  const fn = views[v] || views.home;
  app.innerHTML = fn(arg);
  document.querySelectorAll('#tabs a').forEach((a, k) => TABS[k][3].includes(v || '') ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (!keepScroll) window.scrollTo(0, 0);
  if (v === 'videos' && arg) { const el = document.getElementById('v-' + arg); if (el) el.scrollIntoView(); }
  const h = app.querySelector('h1'); document.title = (h && v ? h.textContent + ' · ' : '') + 'The Contract Line';
  bind(v, arg);
}

function bind(v, arg){
  if (v === 'quiz') app.querySelectorAll('.qopt').forEach(b => b.addEventListener('click', () => {
    const s = store.get('quiz', {i: 0, score: 0, answered: null}); if (s.answered !== null) return;
    const k = +b.dataset.k; s.answered = k; if (k === D.quiz[s.i][2]) s.score++; store.set('quiz', s); document.body.classList.add('still'); route(true);
    const fb = app.querySelector('.fb'); if (fb) fb.scrollIntoView({behavior: 'smooth', block: 'center'});
  }));
  if (v === 'glossary') { const q = $('#q'); q.addEventListener('input', () => { const t = q.value.trim().toLowerCase(); app.querySelectorAll('.gl').forEach(g => g.style.display = g.dataset.t.includes(t) ? '' : 'none'); }); }
  if (v === 'story') {
    const el = $('#swipe'); let x0 = null, y0 = null; const i = +store.get('storyAt', 1);
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0 && i < D.story.length) location.hash = '#/story/' + (i + 1); if (dx > 0 && i > 1) location.hash = '#/story/' + (i - 1); } x0 = null; }, {passive: true});
  }
}
window.addEventListener('hashchange', () => { document.body.classList.remove('still'); route(); });
route();
